# Nginx — slotpremiado.com (Nuxt 4 SSR atrás do PM2)
#
#   sudo cp deploy/nginx-clube-slots.conf /etc/nginx/sites-available/slotpremiado
#   sudo ln -s /etc/nginx/sites-available/slotpremiado /etc/nginx/sites-enabled/
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d slotpremiado.com -d www.slotpremiado.com
#
# O certbot reescreve este arquivo adicionando o bloco 443 e o redirect de HTTP.

upstream clube_slots {
    server 127.0.0.1:3000;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name slotpremiado.com www.slotpremiado.com;

    # Ajuste se DEPLOY_PATH for outro. Aponta para o symlink da release ativa.
    root /var/www/clube-slots/current/.output/public;

    access_log /var/log/nginx/slotpremiado.access.log;
    error_log  /var/log/nginx/slotpremiado.error.log;

    client_max_body_size 2m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/manifest+json;

    # Assets com hash no nome: o Nginx serve direto do disco, sem passar pelo Node.
    location /_nuxt/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # O service worker precisa ser revalidado sempre, senão o PWA congela numa
    # versão antiga e o registerType: 'autoUpdate' nunca dispara.
    location = /sw.js {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
        expires off;
        try_files $uri @nuxt;
    }

    location = /manifest.webmanifest {
        add_header Cache-Control "no-cache";
        expires off;
        try_files $uri @nuxt;
    }

    location / {
        try_files $uri @nuxt;
    }

    location @nuxt {
        proxy_pass http://clube_slots;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Host  $host;
        proxy_set_header Upgrade           $http_upgrade;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
        proxy_buffering       off;
    }

    # O player de slot roda em <iframe>; SAMEORIGIN quebraria o embed do provedor,
    # então protegemos o inverso: ninguém embeda o nosso app.
    add_header X-Frame-Options       "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff"   always;
    add_header Referrer-Policy       "strict-origin-when-cross-origin" always;
}
